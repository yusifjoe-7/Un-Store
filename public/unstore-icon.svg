<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#5b21b6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- Shine overlay -->
  <rect width="512" height="256" rx="112" ry="112" fill="url(#shineGrad)"/>

  <!-- Letter U — bold, geometric, centered -->
  <text
    x="256"
    y="340"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="300"
    font-weight="700"
    text-anchor="middle"
    fill="#ffffff"
    letter-spacing="-8"
  >U</text>

  <!-- Underline accent bar -->
  <rect x="156" y="370" width="200" height="14" rx="7" fill="#ffffff" opacity="0.35"/>
</svg>
